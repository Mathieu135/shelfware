name: Bug report
description: A crash, a parsing failure, or anything that is not a wrong verdict
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        Please check it for anything private before pasting — package names
        can reveal what you work on.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `shelfware --version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
    validations:
      required: true
