version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch bumps rather than five.
      patch-updates:
        update-types:
          - patch
    ignore:
      # Pinned on purpose: libsqlite3-sys 0.38+ needs the unstable
      # `cfg_select` feature, which would raise the MSRV for no gain.
      # See the comment in Cargo.toml.
      - dependency-name: rusqlite
        versions: [">=0.38"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The MSRV job pins this toolchain deliberately — it exists to prove
      # the crate still builds on the oldest supported Rust. Bumping it
      # would silently delete that coverage.
      - dependency-name: dtolnay/rust-toolchain
