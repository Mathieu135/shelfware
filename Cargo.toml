[package]
name = "shelfware"
version = "0.1.0"
edition = "2024"
# Let chains, used in the history parser, landed in 1.88.
rust-version = "1.88"
description = "Find the tools you installed and stopped using."
authors = ["Mathieu135 <64578281+Mathieu135@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mathieu135/shelfware"
keywords = ["cli", "homebrew", "shell", "history", "cleanup"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.8"
# Pinned below 0.38: newer libsqlite3-sys build scripts need an unstable
# compiler feature, which would raise the MSRV for no functional gain.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[profile.release]
strip = true
